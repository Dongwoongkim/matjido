name: PR Test (when a pull request is made, run the pull-request.yml script)

on:
  pull_request:
    branches:
      - develop

jobs:
  test:
    name: Run Gradle Tests on PR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: create env and secure file
        run: |
          echo "${{ secrets.ENV_VARS }}" > .env
          echo "${{ secrets.SECURE_VARS }}" > src/main/resources/application-secret.yml

      - name: Grant permission to gradlew
        run: chmod +x ./gradlew

      - name: Run tests only
        run: ./gradlew --info test

      - name: test result Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()  # 테스트가 실패하여도 Report를 보기 위해 `always`로 설정
        with:
          files: 'build/test-results/**/*.xml'

      - name: test failure Comment
        uses: mikepenz/action-junit-report@v3
        if: always()
        with:
          report_paths: 'build/test-results/test/TEST-*.xml'
